<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Masterpiece Not Found | STACKLY Haute Joaillerie</title>
    <meta name="description" content="The requested STACKLY luxury page or archival creation could not be found. Return to our Haute Joaillerie showcase.">
    <link rel="icon" type="image/png" href="images/image/logo.webp">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            background-color: #0B0C0E;
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Animated Background Glows */
        .bg-glow-orb-1 {
            position: absolute;
            top: 20%;
            left: 25%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(11, 12, 14, 0) 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: floatGlow 12s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .bg-glow-orb-2 {
            position: absolute;
            bottom: 15%;
            right: 20%;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.12) 0%, rgba(11, 12, 14, 0) 70%);
            border-radius: 50%;
            filter: blur(90px);
            animation: floatGlow 15s ease-in-out infinite alternate-reverse;
            pointer-events: none;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -50px) scale(1.15); }
        }

        /* Ambient Geometric Lines */
        .grid-lines {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(212, 175, 55, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(212, 175, 55, 0.03) 1px, transparent 1px);
            background-size: 80px 80px;
            pointer-events: none;
        }

        /* Main Container Card */
        .error-card {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 680px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            background: rgba(18, 20, 24, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 24px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 175, 55, 0.15);
            animation: cardAppear 1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .error-logo {
            height: 64px;
            width: auto;
            object-fit: contain;
            mix-blend-mode: screen;
            filter: contrast(1.6) brightness(1.15) drop-shadow(0 0 20px rgba(212, 175, 55, 0.6));
            margin-bottom: 1.5rem;
            animation: pulseLogo 4s ease-in-out infinite alternate;
        }

        @keyframes pulseLogo {
            0% { filter: contrast(1.6) brightness(1.15) drop-shadow(0 0 15px rgba(212, 175, 55, 0.4)); }
            100% { filter: contrast(1.7) brightness(1.25) drop-shadow(0 0 30px rgba(212, 175, 55, 0.8)); }
        }

        .error-code {
            font-family: 'Cinzel', serif;
            font-size: clamp(5.5rem, 15vw, 8.5rem);
            font-weight: 900;
            line-height: 0.9;
            background: linear-gradient(135deg, #FFF5D0 0%, #D4AF37 45%, #AA7C11 90%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.08em;
            margin: 0;
            text-shadow: 0 10px 40px rgba(212, 175, 55, 0.3);
            animation: shimmerCode 6s ease-in-out infinite alternate;
        }

        @keyframes shimmerCode {
            0% { filter: brightness(1); }
            100% { filter: brightness(1.25) contrast(1.1); }
        }

        .error-subtitle {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.35rem, 3vw, 1.85rem);
            color: #FFFFFF;
            font-weight: 400;
            margin: 1rem 0 0.5rem 0;
            letter-spacing: 0.04em;
        }

        .error-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin: 1.5rem auto;
            width: 60%;
        }

        .error-divider span {
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
        }

        .error-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            font-weight: 300;
            line-height: 1.7;
            max-width: 28rem;
            margin: 0 auto 2.25rem auto;
        }

        /* Buttons Container */
        .error-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            flex-wrap: wrap;
        }

        .btn-404-primary {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.85rem 2rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #0B0C0E;
            background: linear-gradient(135deg, #F5D77F 0%, #D4AF37 50%, #AA7C11 100%);
            border: 1px solid #FFE899;
            border-radius: 9999px;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-404-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.6);
            background: linear-gradient(135deg, #FFE899 0%, #E6BE44 50%, #C49318 100%);
        }

        .btn-404-secondary {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.85rem 2rem;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #D4AF37;
            background: rgba(11, 12, 14, 0.6);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 9999px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-404-secondary:hover {
            transform: translateY(-3px);
            border-color: #D4AF37;
            background: rgba(212, 175, 55, 0.12);
            color: #FFFFFF;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.2);
        }

        @media (max-width: 576px) {
            .error-card {
                padding: 2.5rem 1.5rem;
            }
            .error-actions {
                flex-direction: column;
                width: 100%;
            }
            .btn-404-primary, .btn-404-secondary {
                width: 100%;
                justify-content: center;
                box-sizing: border-box;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Background Orbs -->
    <div class="bg-glow-orb-1"></div>
    <div class="bg-glow-orb-2"></div>
    <div class="grid-lines"></div>

    <!-- Main Content Card -->
    <main class="error-card">
        <img src="images/image/logo.webp" alt="STACKLY Logo" class="error-logo">
        
        <h1 class="error-code">404</h1>
        <h2 class="error-subtitle">Masterpiece Unavailable</h2>

        <div class="error-divider">
            <span></span>
            <i data-lucide="gem" style="width: 16px; height: 16px; color: #D4AF37;"></i>
            <span></span>
        </div>

        <p class="error-desc">
            The private vault item or Haute Joaillerie gallery page you are seeking has been moved or is currently reserved.
        </p>

        <!-- 2 Action Buttons -->
        <div class="error-actions">
            <button onclick="goBack()" class="btn-404-secondary">
                <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
                Go Back
            </button>
            <a href="index.html" class="btn-404-primary">
                <i data-lucide="home" style="width: 16px; height: 16px;"></i>
                Back to Home
            </a>
        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        if (window.lucide) {
            lucide.createIcons();
        }

        // Smart Go Back Function
        function goBack() {
            sessionStorage.setItem('comingFrom404', 'true');
            
            const referrer = document.referrer;
            const isLocalFile = window.location.protocol === 'file:';
            const isSameOrigin = referrer && (isLocalFile ? referrer.startsWith('file:') : referrer.includes(window.location.host));
            
            if (window.history.length > 1) {
                window.history.back();
                
                // Fallback if history.back() fails to run or navigate (e.g., history state issues)
                setTimeout(function() {
                    const prevPage = sessionStorage.getItem('prevScrollPage');
                    const sectionId = sessionStorage.getItem('404_sectionId');
                    if (prevPage) {
                        let targetUrl = prevPage.split('/').pop() || 'index.html';
                        if (sectionId) {
                            targetUrl += '#' + sectionId;
                        }
                        window.location.href = targetUrl;
                    } else if (isSameOrigin) {
                        window.location.href = referrer;
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 150);
            } else if (isSameOrigin) {
                window.location.href = referrer;
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
